# staging.nutrichapina.com — isolated staging vhost for M0+.
# Own container nutrichapina-staging on 127.0.0.1:8083, own bridge network.
# Never point staging at production data; staging has no real customer records.
server {
    server_name staging.nutrichapina.com;

    # Staging must never be indexed.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Certbot HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Canonical staff console is /manage (single console decision, M1 closeout).
    # /admin was a temporary staging harness; redirect it permanently.
    location = /admin {
        return 301 /manage/;
    }

    location /admin/ {
        return 301 /manage/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/staging.nutrichapina.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/staging.nutrichapina.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = staging.nutrichapina.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name staging.nutrichapina.com;

    listen 80;
    return 404; # managed by Certbot


}